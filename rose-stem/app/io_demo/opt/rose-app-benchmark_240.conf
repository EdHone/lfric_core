[env]
MPICH_MPIIO_AGGREGATOR_PLACEMENT_DISPLAY=1
MPICH_MPIIO_HINTS_DISPLAY=1
MPICH_MPIIO_STATS=1
MPICH_MPIIO_TIMERS=1
MPICH_ENV_DISPLAY=1
MPICH_OFI_NIC_VERBOSE=2
FI_LOG_LEVEL=warn
FI_LOG_PROV=cxi
MPICH_OFI_CXI_COUNTER_REPORT=5
VERNIER_OUTPUT_MODE=single

[namelist:io]
write_diag=.true.
diagnostic_frequency=2

[namelist:io_demo]
benchmark_sleep_time=40
io_benchmark=.true.
n_benchmark_fields=240

[namelist:time]
timestep_end='12'

[namelist:timestepping]
dt=3600.0
